server:
  port: 8087

spring:
  application:
    name: admin-service

  datasource:
    url: jdbc:postgresql://localhost:5432/admin_db
    username: ${POSTGRES_USER:booking_hotel}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    enabled: false

jwt:
  # Required JWT_SECRET env (min 32 chars for HS256)
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
