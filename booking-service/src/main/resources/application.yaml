server:
  port: 8083

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: malik
    password: 12345678
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    enabled: false

jwt:
  # For production set JWT_SECRET env (min 32 chars for HS256)
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

catalog-service:
  url: ${CATALOG_SERVICE_URL:http://localhost:8082}

app:
  payment:
    currency: RUB
  kafka:
    topics:
      inventory-reservation-commands: inventory.reservation.commands.v1
      inventory-reservation-events: inventory.reservation.events.v1
      payment-commands: payment.commands.v1
      payment-events: payment.events.v1
      booking-events: booking.events.v1
