services:
  database-backups-init:
    image: postgres:16-alpine
    profiles: ["backup"]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 70:70 /backups"]
    volumes:
      - database-backups-data:/backups
    restart: "no"
    networks:
      - booking-hotel-network

  database-backups:
    image: postgres:16-alpine
    profiles: ["backup"]
    user: "70:70"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      database-backups-init:
        condition: service_completed_successfully
      auth-db:
        condition: service_healthy
      user-db:
        condition: service_healthy
      catalog-db:
        condition: service_healthy
      booking-db:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      payment-db:
        condition: service_healthy
      review-db:
        condition: service_healthy
      admin-db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/backup-loop.sh"]
    environment:
      PGUSER: ${POSTGRES_USER:-booking_hotel}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGCONNECT_TIMEOUT: "10"
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./deploy/backup-loop.sh:/opt/backup-loop.sh:ro
      - ./deploy/backup-health.sh:/opt/backup-health.sh:ro
      - database-backups-data:/backups
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/backup-health.sh"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - booking-hotel-network

  reverse-proxy:
    image: caddy:2.11.4-alpine
    depends_on:
      - api-gateway-service
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - booking-hotel-network

  kafka-data-init:
    image: apache/kafka:3.9.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 1000:1000 /kafka-data"]
    volumes:
      - kafka-data:/kafka-data
    restart: "no"
    networks:
      - booking-hotel-network

  kafka:
    image: apache/kafka:3.9.0
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - booking-hotel-network

  service-discovery:
    build:
      context: ./service-discovery
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - booking-hotel-network

  api-gateway-service:
    build:
      context: ./api-gateway-service
      dockerfile: Dockerfile
    depends_on:
      - service-discovery
    environment:
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka
    restart: unless-stopped
    networks:
      - booking-hotel-network

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER:-booking_hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - booking-hotel-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    depends_on:
      service-discovery:
        condition: service_started
      auth-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-booking_hotel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka
    restart: unless-stopped
    networks:
      - booking-hotel-network

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: ${POSTGRES_USER:-booking_hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - booking-hotel-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    depends_on:
      service-discovery:
        condition: service_started
      user-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/users_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-booking_hotel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka
    restart: unless-stopped
    networks:
      - booking-hotel-network

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalogs_db
      POSTGRES_USER: ${POSTGRES_USER:-booking_hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks:
      - booking-hotel-network

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_started
      catalog-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/catalogs_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-booking_hotel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka
    restart: unless-stopped
    networks:
      - booking-hotel-network

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: ${POSTGRES_USER:-booking_hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - booking-hotel-network

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_started
      booking-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/booking_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-booking_hotel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka
      CATALOG_SERVICE_URL: http://catalog-service:8082
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - booking-hotel-network

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${POSTGRES_USER:-booking_hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - booking-hotel-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    depends_on:
      service-discovery:
        condition: service_started
      notification-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-booking_hotel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka
    restart: unless-stopped
    networks:
      - booking-hotel-network

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${POSTGRES_USER:-booking_hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - booking-hotel-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_started
      payment-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DEMO_PAYMENT_ENABLED: ${DEMO_PAYMENT_ENABLED:-false}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-booking_hotel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka
    restart: unless-stopped
    networks:
      - booking-hotel-network

  review-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: review_db
      POSTGRES_USER: ${POSTGRES_USER:-booking_hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - review-db-data:/var/lib/postgresql/data
    networks:
      - booking-hotel-network

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    depends_on:
      service-discovery:
        condition: service_started
      review-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://review-db:5432/review_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-booking_hotel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka
      BOOKING_SERVICE_URL: http://booking-service:8083
    restart: unless-stopped
    networks:
      - booking-hotel-network

  admin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admin_db
      POSTGRES_USER: ${POSTGRES_USER:-booking_hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - admin-db-data:/var/lib/postgresql/data
    networks:
      - booking-hotel-network

  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    depends_on:
      service-discovery:
        condition: service_started
      admin-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://admin-db:5432/admin_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-booking_hotel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka
    restart: unless-stopped
    networks:
      - booking-hotel-network

networks:
  booking-hotel-network:
    driver: bridge

volumes:
  database-backups-data:
  caddy-data:
  caddy-config:
  kafka-data:
  auth-db-data:
  user-db-data:
  catalog-db-data:
  booking-db-data:
  notification-db-data:
  payment-db-data:
  review-db-data:
  admin-db-data:
