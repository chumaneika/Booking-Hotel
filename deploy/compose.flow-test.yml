# Isolated integration test only. Never use the public test credentials for deployment.
# Combine with ../docker-compose.yml and project bookinghotel-flow-check.
services:
  service-discovery:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -XX:ActiveProcessorCount=2"
    image: eclipse-temurin:17-jre
    build: !reset null
    entrypoint: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ./service-discovery/target/service-discovery-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
  api-gateway-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -XX:ActiveProcessorCount=2"
    image: eclipse-temurin:21-jre
    build: !reset null
    entrypoint: ["java", "-jar", "/app/app.jar"]
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ./api-gateway-service/target/api-gateway-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
  auth-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -XX:ActiveProcessorCount=2"
    image: eclipse-temurin:17-jre
    build: !reset null
    entrypoint: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ./auth-service/target/auth-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
  catalog-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -XX:ActiveProcessorCount=2"
    image: eclipse-temurin:17-jre
    build: !reset null
    entrypoint: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ./catalog-service/target/catalog-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
  booking-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -XX:ActiveProcessorCount=2"
    image: eclipse-temurin:17-jre
    build: !reset null
    entrypoint: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ./booking-service/target/booking-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
  payment-service:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -XX:ActiveProcessorCount=2"
      DEMO_PAYMENT_ENABLED: "true"
    image: eclipse-temurin:17-jre
    build: !reset null
    entrypoint: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ./payment-service/target/payment-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
